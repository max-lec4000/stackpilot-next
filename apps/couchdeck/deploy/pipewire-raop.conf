# AirPlay-Empfänger im Netz (z. B. WiiM) automatisch als Audioausgang anbieten.
# AirPlay-2-Geräte wie der WiiM lehnen die klassische RSA-/unverschlüsselte Verbindung
# mit "403 Forbidden" ab; mit auth_setup funktioniert es (auf medienserver getestet).
context.modules = [
  { name = libpipewire-module-raop-discover
    args = {
      stream.rules = [
        { matches = [ { raop.ip = "~.*" } ]
          actions = { create-stream = { raop.encryption.type = auth_setup } }
        }
      ]
    }
  }
]
