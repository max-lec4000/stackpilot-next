# Tastatur/Maus im Couchdeck-Player. Pfeile, Enter, Esc gehen an die Bedienleiste
# (couchdeck_osc.lua): Ist das Menü offen, navigieren sie dort, sonst gilt die
# normale Belegung (←/→ leiser/lauter, ↓ Audioausgang, Enter Pause/Überspringen, Esc beenden).
# Spulen: Bild↑/Bild↓ bzw. , und . (−10 s / +30 s)
LEFT        script-message-to couchdeck_osc input left
RIGHT       script-message-to couchdeck_osc input right
UP          script-message-to couchdeck_osc input up
DOWN        script-message-to couchdeck_osc input down
ENTER       script-message-to couchdeck_osc input select
KP_ENTER    script-message-to couchdeck_osc input select
ESC         script-message-to couchdeck_osc input back
BS          script-message-to couchdeck_osc input back
F1          script-message-to couchdeck_osc toggle-menu
MENU        script-message-to couchdeck_osc toggle-menu
PGDWN       script-message couchdeck seek-rel -10
PGUP        script-message couchdeck seek-rel 30
,           script-message couchdeck seek-rel -10
.           script-message couchdeck seek-rel 30
q           stop
SPACE       cycle pause
p           cycle pause
s           script-message couchdeck cycle-sub
a           script-message couchdeck cycle-audio
n           script-message couchdeck next
N           script-message couchdeck previous
i           script-binding stats/display-stats-toggle
m           script-message couchdeck toggle-mute
# Wiedergabe-Medientasten
PLAYPAUSE   cycle pause
PLAY        set pause no
PAUSE       set pause yes
STOP        stop
NEXT        script-message couchdeck next
PREV        script-message couchdeck previous
FORWARD     script-message couchdeck seek-rel 30
REWIND      script-message couchdeck seek-rel -10
TAB         script-message-to couchdeck_osc show

# Maus: Rechtsklick / Zurück-Taste beendet, Linksklick siehe Bedienleiste
MBTN_RIGHT      stop
MBTN_BACK       stop
MBTN_FORWARD    script-message couchdeck seek-rel 30
# Lautstärketasten / Drehregler: immer die Systemlautstärke (wie Menü und Controller)
VOLUME_UP       script-message couchdeck volume-step 2
VOLUME_DOWN     script-message couchdeck volume-step -2
MUTE            script-message couchdeck toggle-mute
WHEEL_UP        script-message couchdeck volume-step 2
WHEEL_DOWN      script-message couchdeck volume-step -2
MOUSE_MOVE      script-message-to couchdeck_osc show
